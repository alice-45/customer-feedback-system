<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | FeedbackHub</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 45px 40px;

            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.2);

            text-align: center;
        }

        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            color: white;

            font-size: 32px;
        }

        h1 {
            margin-bottom: 8px;

            color: #222;

            font-size: 28px;
        }

        .subtitle {
            color: #777;

            margin-bottom: 30px;

            font-size: 14px;
        }

        .form-group {
            text-align: left;

            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #333;
        }

        input {
            width: 100%;

            height: 52px;

            padding: 0 15px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

            transition: 0.3s;
        }

        input:focus {
            border-color: #667eea;

            box-shadow:
                0 0 0 3px
                rgba(102, 126, 234, 0.15);
        }

        .login-btn {
            width: 100%;

            height: 52px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px
                rgba(102, 126, 234, 0.3);
        }

        .back-link {
            display: inline-block;

            margin-top: 25px;

            color: #667eea;

            text-decoration: none;

            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .message {
            padding: 12px;

            margin-bottom: 20px;

            border-radius: 8px;

            font-size: 14px;
        }

        .success {
            background: #e8f8ef;

            color: #16803c;
        }

        .error {
            background: #fdeaea;

            color: #c62828;
        }

        @media (max-width: 500px) {

            .login-card {
                padding: 35px 25px;
            }

            h1 {
                font-size: 24px;
            }
        }

    </style>

</head>


<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                🔐
            </div>

            <h1>Admin Login</h1>

            <p class="subtitle">
                Login to access the FeedbackHub dashboard
            </p>


            <!-- Flash Messages -->

            {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                    {% for category, message in messages %}

                        <div class="message {{ category }}">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <!-- Login Form -->

            <form
                action="{{ url_for('login') }}"
                method="POST"
            >

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter admin username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter admin password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login to Dashboard
                </button>

            </form>


            <a
                href="{{ url_for('home') }}"
                class="back-link"
            >
                ← Back to Feedback Form
            </a>

        </div>

    </div>

</body>

</html>
